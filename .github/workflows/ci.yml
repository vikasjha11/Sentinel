name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install dependencies
        run: |
          npm ci --prefix backend || npm install --prefix backend
          npm install --prefix frontend
          npm install --prefix ecommerce/server
          npm install --prefix ecommerce/client
      - name: Backend unit and integration tests (policy, lifecycle, executors, pipeline, monitor)
        run: npm test --prefix backend
      - name: AI engine tests
        run: python3 -m unittest discover -s services/ai-engine/tests
      - name: Storefront tests
        run: |
          npm test --prefix ecommerce/server
          npm test --prefix ecommerce/client
      - name: Build frontends
        run: |
          npm run build --prefix frontend
          npm run build --prefix ecommerce/client
      - name: Validate Docker Compose file
        run: docker compose --env-file .env.example config --quiet
      - name: Validate Kubernetes manifests
        run: python3 -c "import yaml,sys,glob;[list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s/*.yaml')]"
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose --env-file .env.example build
