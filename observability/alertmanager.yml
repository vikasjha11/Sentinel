route:
  receiver: sentinel
  group_by: [alertname, service]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h
receivers:
  - name: sentinel
    webhook_configs:
      - url: http://backend:4000/api/alerts/webhook
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/webhook-token
